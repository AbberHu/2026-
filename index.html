<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b4763">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DXS應援交換">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <title>DXS 應援交換</title>
    <style>
    :root {
      --bg: #2d3e55;                    /* deep poster navy (SERENADE ON STAGE) */
      --bg-gradient: linear-gradient(180deg, #2d3e55 0%, #335f7d 30%, #3f758e 60%, #598192 100%);
      --bg-elevated: #3d5f7d;           /* lighter navy for elevated elements */
      --bg-elevated-2: #4a6d89;
      --surface: #faf6e8;               /* warm cream card */
      --surface-alt: #f0e9d0;           /* darker cream for headers */
      --border: #d9cca1;
      --border-strong: #c9a961;
      --border-navy: #4a6d89;
      --text: #2b4763;                  /* navy text on cream cards */
      --text-muted: #7a7364;
      --text-soft: #b8a688;
      --text-on-bg: #faf6e8;            /* cream text on navy body */
      --text-on-bg-muted: #a8b0c8;
      --primary: #c9a961;               /* gold */
      --primary-hover: #b8974f;
      --primary-fg: #2b4763;            /* navy text on gold buttons */
      --navy: #2b4763;
      --navy-fg: #faf6e8;
      --gold: #d4b876;
      --gold-bright: #e8ddb8;
      --danger: #dc2626;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.15);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.25);
      --shadow-lg: 0 10px 30px rgba(0,0,0,0.35);
      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Helvetica Neue", sans-serif;
      color: var(--text-on-bg);
      background: var(--bg);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      min-height: 100vh;
      min-height: 100dvh;
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input, textarea { font-family: inherit; color: inherit; }
    a { color: inherit; text-decoration: none; }

    .container { max-width: 800px; margin: 0 auto; padding: 0 16px; }

    /* ===== Header ===== */
    .app-header {
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
      padding-top: env(safe-area-inset-top);
      border-bottom: 1px solid var(--border-navy);
    }
    .app-header::before {
      content: '';
      position: absolute;
      inset: env(safe-area-inset-top) 0 0 0;
      background-image:
        radial-gradient(circle at 12% 25%, var(--gold-bright) 1.2px, transparent 1.8px),
        radial-gradient(circle at 88% 18%, var(--gold-bright) 1.6px, transparent 2.2px),
        radial-gradient(circle at 42% 62%, var(--gold) 1.2px, transparent 1.6px),
        radial-gradient(circle at 72% 78%, var(--gold-bright) 1.2px, transparent 1.6px),
        radial-gradient(circle at 22% 82%, var(--gold) 0.9px, transparent 1.3px),
        radial-gradient(circle at 60% 32%, var(--gold-bright) 0.8px, transparent 1.2px);
      background-size: 100% 100%;
      opacity: 0.65;
      pointer-events: none;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-top: 16px;
      padding-bottom: 8px;
      position: relative;
    }
    .brand-title-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .brand-dxs {
      font-family: Georgia, "Times New Roman", "Noto Serif TC", serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-on-bg);
      letter-spacing: 0.02em;
    }
    .brand-serenade {
      font-family: 'Great Vibes', 'Playfair Display', serif;
      font-size: 30px;
      font-weight: 400;
      color: var(--text-on-bg-muted);
      letter-spacing: 0.05em;
      line-height: 1;
      transform: translateY(1px);
    }
    .brand-sub {
      font-size: 12px;
      color: var(--text-on-bg-muted);
      margin-top: 4px;
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      background: var(--bg-elevated);
      color: var(--text-on-bg);
      font-size: 12px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-navy);
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-secondary:hover:not(:disabled) { background: var(--bg-elevated-2); border-color: var(--gold); }
    .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-secondary svg { width: 14px; height: 14px; }

    .filter-tabs {
      display: flex;
      gap: 8px;
      padding-bottom: 12px;
      overflow-x: auto;
      scrollbar-width: none;
      position: relative;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .filter-tab {
      padding: 7px 14px;
      background: var(--bg-elevated);
      color: var(--text-on-bg-muted);
      font-size: 13px;
      font-weight: 500;
      border-radius: 999px;
      border: 1px solid var(--border-navy);
      white-space: nowrap;
      transition: all 0.15s;
    }
    .filter-tab .badge {
      opacity: 0.7;
      margin-left: 3px;
    }
    .filter-tab.active {
      background: var(--gold);
      color: var(--navy);
      border-color: var(--gold);
      font-weight: 700;
    }
    .filter-tab.active .badge { opacity: 1; }

    /* ===== Records tab layout: vertical sidebar + main ===== */
    .records-layout {
      display: grid !important;
      grid-template-columns: 110px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      width: 100%;
    }
    @media (min-width: 640px) {
      .records-layout {
        grid-template-columns: 160px minmax(0, 1fr);
        gap: 14px;
      }
    }
    .filter-sidebar {
      display: flex !important;
      flex-direction: column !important;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 6px;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 8px;
      align-self: start;
    }
    .filter-vtab {
      display: flex !important;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 10px 10px;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-sm);
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
      width: 100%;
    }
    .filter-vtab:hover {
      background: var(--surface-alt);
      color: var(--text);
    }
    .filter-vtab.active {
      background: var(--navy);
      color: var(--navy-fg);
    }
    .filter-vtab.disabled,
    .filter-vtab:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
      color: var(--text-muted);
    }
    .filter-vtab.disabled .badge {
      opacity: 0.6;
    }
    .filter-vtab .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      background: rgba(0,0,0,0.08);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      opacity: 1;
      margin: 0;
    }
    .filter-vtab.active .badge {
      background: rgba(255,255,255,0.18);
      color: var(--navy-fg);
    }
    .filter-vtab-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .records-main {
      min-width: 0;
    }

    /* ===== Main tabs ===== */
    .main-tabs {
      display: flex;
      gap: 4px;
      padding: 4px 16px 0;
      position: relative;
    }
    .main-tab {
      flex: 1;
      padding: 10px 12px;
      background: transparent;
      color: var(--text-on-bg-muted);
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
      cursor: pointer;
    }
    .main-tab:hover { color: var(--text-on-bg); }
    .main-tab.active {
      color: var(--gold-bright);
      border-bottom-color: var(--gold);
    }

    /* ===== Main content ===== */
    main {
      padding: 16px 0 96px 0;
    }
    .list-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      min-width: 700px;
      font-size: 14px;
      border-collapse: collapse;
      color: var(--text);
    }
    thead {
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
    }
    th {
      padding: 10px 12px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    td {
      padding: 12px;
      vertical-align: top;
      border-top: 1px solid var(--border);
    }
    tbody tr:hover { background: rgba(232, 220, 175, 0.3); }
    tbody tr:first-child td { border-top: none; }

    .date-chip {
      display: inline-block;
      padding: 3px 10px;
      background: var(--navy);
      color: var(--navy-fg);
      font-size: 11px;
      font-weight: 700;
      border-radius: 999px;
      white-space: nowrap;
    }
    .username-link {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 14px;
      font-weight: 600;
      color: var(--navy);
      transition: color 0.15s;
    }
    .username-link:hover { color: var(--primary-hover); }
    .username-link .ext-icon { width: 11px; height: 11px; color: var(--text-soft); }
    .post-link {
      display: inline-block;
      margin-top: 2px;
      font-size: 11px;
      color: var(--text-muted);
      text-decoration: underline;
      text-decoration-color: var(--border);
      text-underline-offset: 2px;
    }
    .post-link:hover { color: var(--primary-hover); }

    .items-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .items-list li {
      display: flex;
      gap: 6px;
      margin-bottom: 2px;
      font-size: 14px;
      color: var(--text);
      word-break: break-word;
    }
    .items-list .item-star {
      color: var(--primary);
      flex-shrink: 0;
    }

    .wanted-chips-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .qty-badge {
      display: inline-block;
      margin-left: 4px;
      padding: 0 4px;
      background: rgba(255,255,255,0.6);
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
    }
    .wanted-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px 3px 4px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 999px;
      border: 1px solid;
      white-space: nowrap;
    }
    .wanted-chip img { width: 20px; height: 20px; border-radius: 999px; object-fit: cover; }
    .wanted-chip.wanted-doa {
      background: #f4ead0;
      color: #5d4820;
      border-color: #c4a663;
    }
    .wanted-chip.wanted-boo {
      background: #fce4c9;
      color: #8b3c15;
      border-color: #e8985c;
    }
    .wanted-chip.wanted-both {
      background: #e5eaf6;
      color: #2b4763;
      border-color: #7b8bb8;
    }
    .wanted-chip.wanted-both .star-icon {
      width: 16px; height: 16px; color: var(--primary);
    }

    .notes-text {
      font-size: 13px;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .empty-cell { color: var(--text-soft); font-size: 12px; }

    .row-actions {
      display: flex;
      gap: 2px;
    }
    .icon-btn {
      padding: 6px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      transition: background 0.15s, color 0.15s;
    }
    .icon-btn:hover { background: var(--surface-alt); }
    .icon-btn.danger:hover { background: #fee2e2; color: var(--danger); }
    .icon-btn svg { width: 16px; height: 16px; display: block; }

    /* ===== Empty state ===== */
    .empty-state {
      text-align: center;
      padding: 64px 16px;
    }
    .empty-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 999px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-navy);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
    }
    .empty-icon svg { width: 32px; height: 32px; }
    .empty-state p { color: var(--text-on-bg); font-size: 14px; }
    .empty-state .hint { color: var(--text-on-bg-muted); font-size: 12px; margin-top: 4px; }

    /* ===== Floating Action Button ===== */
    /* ===== Add block (clickable empty/add card) ===== */
    .add-block {
      background: var(--surface);
      border: 2px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      display: block;
      width: 100%;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .add-block:hover {
      background: var(--surface-alt);
      border-color: var(--primary);
    }
    .add-block:active {
      transform: scale(0.99);
    }
    .add-block-icon {
      width: 56px;
      height: 56px;
      border-radius: 999px;
      background: var(--primary);
      color: var(--primary-fg);
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(201, 169, 97, 0.4);
      transition: transform 0.15s;
    }
    .add-block:hover .add-block-icon { transform: scale(1.08); }
    .add-block-icon svg { width: 28px; height: 28px; }
    .add-block-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 10px;
      line-height: 1.5;
      letter-spacing: 0.02em;
    }
    .add-block-hint {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
      opacity: 0.75;
    }

    /* Compact variant */
    .add-block.compact {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .add-block.compact .add-block-icon {
      width: 36px;
      height: 36px;
      margin: 0;
    }
    .add-block.compact .add-block-icon svg { width: 18px; height: 18px; }
    .add-block.compact .add-block-title { margin: 0; }
    .add-block.compact .add-block-hint { display: none; }

    /* Inside stats card or list-card, add spacing */
    .stats-card > .add-block,
    .list-card > .add-block {
      margin-top: 12px;
      margin-bottom: 0;
    }
    .list-card > .add-block {
      margin: 12px 16px 16px;
    }

    /* ===== Modal ===== */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(20, 30, 45, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 20;
      padding-top: env(safe-area-inset-top);
    }
    .modal.hidden { display: none; }
    .modal-content {
      background: var(--surface);
      color: var(--text);
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      max-height: 92dvh;
      border-radius: 24px 24px 0 0;
      overflow-y: auto;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
    }
    @media (min-width: 640px) {
      .modal { align-items: center; padding: 20px; }
      .modal-content { border-radius: var(--radius-lg); }
    }

    .modal-header {
      position: sticky;
      top: 0;
      background: var(--navy);
      color: var(--navy-fg);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 5;
      overflow: hidden;
    }
    .modal-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, var(--gold-bright) 1px, transparent 1.5px),
        radial-gradient(circle at 80% 40%, var(--gold-bright) 1.2px, transparent 1.8px),
        radial-gradient(circle at 50% 70%, var(--gold) 1px, transparent 1.4px);
      background-size: 100% 100%;
      opacity: 0.5;
      pointer-events: none;
    }
    .modal-header > * { position: relative; z-index: 1; }
    .modal-header h2 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .close-btn {
      padding: 6px;
      margin-left: -6px;
      border-radius: var(--radius-sm);
      color: var(--navy-fg);
    }
    .close-btn:hover { background: rgba(255,255,255,0.1); }
    .close-btn svg { width: 20px; height: 20px; display: block; }

    .btn-primary {
      padding: 7px 14px;
      background: var(--primary);
      color: var(--primary-fg);
      font-size: 13px;
      font-weight: 700;
      border-radius: var(--radius-sm);
      transition: background 0.15s;
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-primary:disabled {
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.3);
      cursor: not-allowed;
    }

    .form-body { padding: 16px; display: flex; flex-direction: column; gap: 18px; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .date-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .date-btn {
      padding: 11px;
      background: white;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .date-btn.selected {
      background: var(--navy);
      color: var(--navy-fg);
      border-color: var(--navy);
    }
    .date-btn.disabled,
    .date-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
      background: rgba(60, 40, 15, 0.06);
      color: var(--text-muted);
      border-color: var(--border);
    }
    .date-btn.disabled.selected,
    .date-btn:disabled.selected {
      background: var(--surface-alt);
      color: var(--text-muted);
      border-color: var(--border);
    }

    .inventory-field.disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .inventory-field.disabled input {
      background: rgba(60, 40, 15, 0.06);
      color: var(--text-muted);
      cursor: not-allowed;
      border-color: var(--border);
    }
    .inventory-field.disabled .inventory-field-label {
      color: var(--text-muted);
    }

    .field-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: -2px;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .text-input {
      width: 100%;
      padding: 10px 12px;
      background: white;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .text-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.25);
    }
    textarea.text-input { resize: none; font-family: inherit; }

    .preview-card {
      margin-top: 8px;
      padding: 12px;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .preview-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .preview-label svg { width: 11px; height: 11px; color: var(--primary); }
    .preview-username {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary-hover);
    }
    .preview-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .warn { margin-top: 6px; font-size: 11px; color: #b45309; }

    .items-input-list { display: flex; flex-direction: column; gap: 8px; }
    .item-row { display: flex; align-items: center; gap: 8px; }
    .item-marker {
      color: var(--primary);

    /* ===== Custom confirm dialog ===== */
    .confirm-overlay {

      -webkit-backdrop-filter: blur(4px);

    @media (max-width: 480px) {

      .brand-title-row { gap: 6px; }
      .brand-dxs { font-size: 22px; }
      .brand-serenade { font-size: 26px; }
      .brand-subtitle { font-size: 10px; }

      .tab-title-row { margin-bottom: 14px; padding: 4px 0 0; }

        font-size: 10px;

      .list-card, .stats-card {

      }
      .stats-card { padding: 12px 14px; }
      .stats-title { font-size: 11px; margin-bottom: 10px; }

      .add-block { padding: 22px 12px; }
      .add-block-icon { width: 44px; height: 44px; margin-bottom: 8px; }
      .add-block-icon svg { width: 22px; height: 22px; }

      .add-block.compact .add-block-icon { width: 30px; height: 30px; }
      .add-block.compact .add-block-icon svg { width: 15px; height: 15px; }
      .add-block.compact .add-block-title { font-size: 13px; }

      /* Table smaller */
      th, td {
        padding: 8px 10px !important;
        font-size: 12px;
      }

      /* Stats bar - reduce widths on mobile */
      .stats-bar-row { font-size: 11px; }
      .stats-bar-name {
        width: 7em;
        min-width: 7em;
        max-width: 7em;
        margin-right: 2em;
      }

      .stats-count-mascot { width: 24px; height: 24px; }
      .stats-counts-row { gap: 14px; row-gap: 8px; }
      .stats-section-header { margin-bottom: 6px; }
      .stats-section-name { font-size: 13px; }

      /* Modal */
      .modal-content { border-radius: 14px 14px 0 0; padding: 0; }
      .modal-header { padding: 12px 14px; }
      .modal-header h2 { font-size: 15px; }
      .form-body { padding: 14px; gap: 12px; }
      .field label { font-size: 12px; }
      .text-input { padding: 9px 11px; font-size: 13px; }

      .wanted-stepper-name { font-size: 13px; }
      .qty-btn { width: 26px; height: 26px; font-size: 16px; }
      .qty-value { font-size: 14px; }

      /* Icon picker */
      .icon-picker { max-height: 150px; }
      .icon-option { padding: 2px; }

      /* Confirm dialog */

    /* ===== Butterflies (top-down, symmetric) ===== */
    .butterflies {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .butterfly {
      position: absolute;
      top: 0;
      left: 0;
      width: 40px;
      height: 32px;
      will-change: transform, opacity;
      filter:
        drop-shadow(0 0 4px rgba(255, 255, 255, 1))
        drop-shadow(0 0 14px rgba(200, 220, 255, 0.6))
        drop-shadow(0 0 26px rgba(180, 200, 245, 0.35));
    }
    .butterfly .bfly { width: 100%; height: 100%; display: block; }

    /* Wings flap horizontally (scale toward body) - subtle, not too extreme */
    .butterfly .wing {
      transform-box: fill-box;
      animation: flap 0.42s ease-in-out infinite alternate;
    }
    .butterfly .wing-l { transform-origin: 100% 50%; }
    .butterfly .wing-r { transform-origin: 0% 50%; }
    @keyframes flap {
      from { transform: scaleX(1); }
      to   { transform: scaleX(0.65); }
    }

    .butterfly.b1 { width: 44px; height: 34px; animation: fly-1 30s linear infinite; }
    .butterfly.b2 { width: 32px; height: 25px; animation: fly-2 38s linear infinite; animation-delay: -12s; }
    .butterfly.b3 { width: 54px; height: 42px; animation: fly-3 34s linear infinite; animation-delay: -20s; }
    .butterfly.b4 { width: 28px; height: 22px; animation: fly-4 42s linear infinite; animation-delay: -8s; }
    .butterfly.b1 .wing { animation-duration: 0.40s; }
    .butterfly.b2 .wing { animation-duration: 0.34s; }
    .butterfly.b3 .wing { animation-duration: 0.48s; }
    .butterfly.b4 .wing { animation-duration: 0.30s; }

    @keyframes fly-1 {
      0%   { transform: translate(-10vw, 22vh) rotate(-3deg); opacity: 0; }
      10%  { opacity: 0.9; }

    };

    const CATEGORY_COLOR_PALETTE = [
      { bg: '#f4ead0', border: '#c4a663', text: '#5d4820' },
      { bg: '#fce4c9', border: '#e8985c', text: '#8b3c15' },
      { bg: '#e5eaf6', border: '#7b8bb8', text: '#2a3557' },
      { bg: '#f0e5f5', border: '#a86ab3', text: '#583770' },
      { bg: '#dcf0e2', border: '#5aa06e', text: '#254a30' },
      { bg: '#fce0e0', border: '#c76a6a', text: '#7a2e2e' },
      { bg: '#fdf0c9', border: '#c9a661', text: '#7a5c1e' }
    ];

    const DEFAULT_CATEGORIES = [];

    const EMOJI_OPTIONS = ['🎵', '🌸', '💖', '⭐', '✨', '🎀', '🎁', '🌈', '💌', '🐶', '🍊', '☀️', '🌙', '🎨', '🌷', '🦋', '💫', '🍀'];

    function getWantedOptions() {
      return state.categories.map((cat) => ({
        value: cat.id,
        label: cat.name,
        icon: cat.icon,
        color: CATEGORY_COLOR_PALETTE[cat.color % CATEGORY_COLOR_PALETTE.length],
        type: cat.type
      }));
    }

    function getCategoryById(id) {
      return state.categories.find(c => c.id === id);
    }

    function newCategoryId() {
      return 'cat_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function renderCatIcon(icon, sizePx) {
      const s = sizePx || 18;
      const imgStyle = `width:${s}px;height:${s}px;object-fit:cover;border-radius:999px;flex-shrink:0;display:inline-block;vertical-align:middle`;
      // Image-based icons (DOA, BOO, plus custom mascots)
      if (CATEGORY_ICONS[icon]) return `<img src="${CATEGORY_ICONS[icon]}" alt="" style="${imgStyle}">`;
      if (icon === 'star') return ICONS.star.replace('<svg', `<svg style="width:${s}px;height:${s}px;color:var(--primary);flex-shrink:0;display:inline-block;vertical-align:middle"`);
      if (icon && icon.startsWith('emoji:')) return `<span style="font-size:${s * 0.9}px;line-height:1;display:inline-flex;align-items:center;justify-content:center;width:${s}px;height:${s}px;flex-shrink:0;vertical-align:middle">${icon.slice(6)}</span>`;
      return `<span style="font-size:${s * 0.6}px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;width:${s}px;height:${s}px;flex-shrink:0">?</span>`;
    }
    const STORAGE_KEY = 'dxs-exchange-list-v1';

    // ============== State ==============
    const state = {
      entries: [],
      categories: [],
      filter: 'all',
      editingId: null,
      editingCategoryId: null,
      activeTab: 'records',
      enabledDates: ['7/24', '7/25', '7/26'],
      // Form working data (only used when modal open)
      form: {
        date: '7/24',
        threadsUrl: '',
        exchangeItems: [''],
        wanted: [],
        notes: ''
      },
      categoryForm: {
        name: '',
        icon: 'star',
        color: 0,
        inventory: {}  // populated by DATE_OPTIONS on first render
      },
      saveError: null,
    };

    // ============== Persistence ==============
    function loadEntries() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            state.entries = parsed.map(migrateEntry);
          }
        }
      } catch (e) { console.warn('load failed', e); }
    }

    function persistEntries() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.entries));
        state.saveError = null;
      } catch (e) {
        state.saveError = '儲存失敗，可能是儲存空間不足';
        console.error(e);
      }
    }



    function loadEnabledDates() {
      try {
        const raw = localStorage.getItem(ENABLED_DATES_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            state.enabledDates = parsed.filter(d => DATE_OPTIONS.includes(d));
            if (state.enabledDates.length === 0) state.enabledDates = [...DATE_OPTIONS];
            return;
          }
        }
      } catch (e) {}
      state.enabledDates = [...DATE_OPTIONS];
    }

    function persistEnabledDates() {
      try {
        localStorage.setItem(ENABLED_DATES_KEY, JSON.stringify(state.enabledDates));
      } catch (e) {}
    }

    function activeDates() {
      return DATE_OPTIONS.filter(d => state.enabledDates.includes(d));
    }

    function loadCategories() {
      try {
        const raw = localStorage.getItem(CATEGORIES_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            state.categories = parsed;
            return;
          }
        }
      } catch (e) {}
      state.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
    }

    function persistCategories() {
      try {
        localStorage.setItem(CATEGORIES_KEY, JSON.stringify(state.categories));
      } catch (e) { console.error('save categories failed', e); }
    }

    function migrateCategoriesAndEntries() {
      // 1. Migrate categories: remove type field, remove combo categories (they're expanded into entries)
      const singleCategoryIds = state.categories.filter(c => !c.type || c.type === 'single').map(c => c.id);
      const comboCategoryIds = state.categories.filter(c => c.type === 'combo').map(c => c.id);

      // 2. Migrate entries: wantedItem (single id) → wanted array
      state.entries = state.entries.map(entry => {
        if (Array.isArray(entry.wanted)) return entry; // already migrated
        const newEntry = { ...entry };
        delete newEntry.wantedItem;

        if (!entry.wantedItem) {
          newEntry.wanted = [];
          return newEntry;
        }
        // First try to find by ID
        let cat = state.categories.find(c => c.id === entry.wantedItem);
        // Fallback: try by name (very old data)
        if (!cat) cat = state.categories.find(c => c.name === entry.wantedItem);

        if (cat && (!cat.type || cat.type === 'single')) {
          newEntry.wanted = [{ categoryId: cat.id, quantity: 1 }];
        } else if (cat && cat.type === 'combo') {
          // Expand combo into each single category
          newEntry.wanted = singleCategoryIds.map(id => ({ categoryId: id, quantity: 1 }));
        } else {
          newEntry.wanted = [];
        }
        return newEntry;
      });

      // 3. Remove combo categories from state.categories, and strip 'type' from remaining
      state.categories = state.categories
        .filter(c => !c.type || c.type === 'single')
        .map(c => {
          const clean = { ...c };
          delete clean.type;
          if (!clean.inventory) clean.inventory = {};
          // Ensure inventory has all dates in DATE_OPTIONS (default to 20 for missing)
          DATE_OPTIONS.forEach(d => {
            if (clean.inventory[d] === undefined) clean.inventory[d] = 0;
          });
          return clean;
        });

      persistCategories();
      persistEntries();
    }

    function migrateEntry(entry) {
      if (Array.isArray(entry.exchangeItems)) return entry;
      if (typeof entry.exchangeItem === 'string' && entry.exchangeItem.trim()) {
        const items = entry.exchangeItem
          .split(/\r?\n/)
          .map(s => s.replace(/^[\-\u2022\u30fb\*\s]+/, '').trim())
          .filter(Boolean);
        const { exchangeItem, ...rest } = entry;
        return { ...rest, exchangeItems: items };
      }
      return { ...entry, exchangeItems: [] };
    }

    // ============== Utilities ==============
    function parseThreadsUrl(url) {
      if (!url || typeof url !== 'string') return null;
      const trimmed = url.trim();
      const match = trimmed.match(/threads\.(?:net|com)\/@([A-Za-z0-9_.]+)/i);
      if (match) {
        return {
          username: match[1],
          profileUrl: `https://www.threads.com/@${match[1]}`,
          postUrl: trimmed
        };
      }
      return null;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    function csvCell(value) {
      const s = String(value == null ? '' : value);
      if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }

    function exportCsv(entries) {
      const headers = ['場次', 'Threads 帳號', '貼文網址', '交換物', '想交換', '備註'];
      const rows = entries.map(e => {
        const wantedText = (e.wanted || []).map(w => {
          const cat = getCategoryById(w.categoryId);
          if (!cat) return '';
          return w.quantity > 1 ? `${cat.name} ×${w.quantity}` : cat.name;
        }).filter(Boolean).join(', ');
        return [
          e.date,
          e.threadsUsername ? '@' + e.threadsUsername : '',
          e.threadsUrl || '',
          (e.exchangeItems || []).map(i => '- ' + i).join('\n'),
          wantedText,
          e.notes || ''
        ];
      });
      const csv = '\uFEFF' + [
        headers.map(csvCell).join(','),
        ...rows.map(r => r.map(csvCell).join(','))
      ].join('\r\n');

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      const today = new Date().toISOString().slice(0, 10);
      link.href = url;
      link.download = `DXS交換記錄_${today}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 100);
    }

    function getFilteredEntries() {
      return state.filter === 'all'
        ? state.entries
        : state.entries.filter(e => e.date === state.filter);
    }

    function getSortedEntries() {
      return [...getFilteredEntries()].sort((a, b) => {
        if (a.date !== b.date) return a.date.localeCompare(b.date);
        return b.createdAt - a.createdAt;
      });
    }

    // ============== Rendering ==============
    function calculateStats() {
      // Each entry has: wanted: [{categoryId, quantity}]
      // cards[catId] = sum of quantities across entries for that date
      const dates = DATE_OPTIONS;
      const perDate = {};
      dates.forEach(d => {
        perDate[d] = { cards: {}, entryCount: 0 };
        state.categories.forEach(c => { perDate[d].cards[c.id] = 0; });
      });
      const total = { cards: {}, entryCount: 0 };
      state.categories.forEach(c => { total.cards[c.id] = 0; });

      state.entries.forEach(entry => {
        const d = perDate[entry.date];
        if (!d) return;
        d.entryCount++;
        total.entryCount++;
        (entry.wanted || []).forEach(w => {
          const q = w.quantity || 0;
          if (d.cards[w.categoryId] !== undefined) d.cards[w.categoryId] += q;
          if (total.cards[w.categoryId] !== undefined) total.cards[w.categoryId] += q;
        });
      });

      return { perDate, total, categories: state.categories };
    }

    function renderStatsCard() {
      const noEntries = state.entries.length === 0;
      const noCategories = state.categories.length === 0;
      if (noCategories) {
        return `
          <div class="stats-card">
            <div class="stats-title">${ICONS.star} 應援物統計</div>
            <div class="add-block" data-action="add-category">
              <div class="add-block-icon">${ICONS.star}</div>
              <div class="add-block-title">還沒設定任何應援物類別</div>
              <div class="add-block-hint">請點擊星星進行新增</div>
            </div>
          </div>
        `;
      }
      const stats = calculateStats();
      const sections = DATE_OPTIONS
        .filter(d => {
          // Only show date if has entries OR any category has inventory > 0 for that date
          const perDate = stats.perDate[d];
          if (perDate && perDate.entryCount > 0) return true;
          return state.categories.some(cat =>
            cat.inventory && (cat.inventory[d] || 0) > 0
          );
        })
        .map(d => ({ key: d, label: d, data: stats.perDate[d] }));
      // Only show 合計 if there is more than one date section
      if (sections.length >= 2) {
        sections.push({ key: 'total', label: '合計', data: stats.total, isTotal: true });
      }

      const barClass = (rem, max) => {
        if (rem < 0) return 'danger';
        if (max === 0) return '';
        if (rem / max <= 0.15) return 'low';
        return '';
      };

      const categories = state.categories;

      const sectionsHtml = sections.map(sec => {
        // Count row: only show categories with inventory or usage
        const relevantCats = categories.filter(cat => {
          const inv = cat.inventory || {};
          if (sec.key === 'total') {
            return DATE_OPTIONS.some(d => (inv[d] || 0) > 0) || (sec.data.cards[cat.id] || 0) > 0;
          }
          return (inv[sec.key] || 0) > 0 || (sec.data.cards[cat.id] || 0) > 0;
        });
        const catCountsHtml = relevantCats.length === 0
          ? '<span style="color:var(--text-muted);font-size:12px">尚未設定類別</span>'
          : relevantCats.map(cat => {
              const count = sec.data.cards[cat.id] || 0;
              return `
                <span class="stats-count">
                  <span class="stats-count-mascot" style="background:${CATEGORY_COLOR_PALETTE[cat.color % CATEGORY_COLOR_PALETTE.length].bg}">
                    ${renderCatIcon(cat.icon, 24)}
                  </span>
                  <span class="stats-count-label">${escapeHtml(cat.name)}</span>
                  <span class="stats-count-num">${count}</span>
                </span>
              `;
            }).join('');

        // Bars: only for categories with inventory > 0 for this section
        const barsHtml = categories.filter(cat => {
          const inv = cat.inventory || {};
          if (sec.key === 'total') {
            return DATE_OPTIONS.some(d => (inv[d] || 0) > 0) || (sec.data.cards[cat.id] || 0) > 0;
          }
          return (inv[sec.key] || 0) > 0 || (sec.data.cards[cat.id] || 0) > 0;
        }).map(cat => {
          const inv = cat.inventory || { '7/24': 0, '7/25': 0 };
          const max = sec.key === 'total' ? DATE_OPTIONS.reduce((s, d) => s + (inv[d] || 0), 0) : (inv[sec.key] || 0);
          const used = sec.data.cards[cat.id] || 0;
          const rem = max - used;
          const pct = max > 0 ? Math.max(0, Math.min(100, (rem / max) * 100)) : 0;
          const cls = barClass(rem, max);
          const valCls = rem < 0 ? 'danger' : '';
          const paletteColor = CATEGORY_COLOR_PALETTE[cat.color % CATEGORY_COLOR_PALETTE.length];
          const barStyle = cls === 'danger'
            ? 'background: linear-gradient(90deg, #ef4444, #dc2626)'
            : cls === 'low'
            ? 'background: linear-gradient(90deg, #f59e0b, #d97706)'
            : `background: linear-gradient(90deg, ${paletteColor.border}dd, ${paletteColor.border})`;
          return `
            <div class="stats-bar-row">
              <span class="stats-bar-name">${escapeHtml(cat.name)}</span>
              <div class="stats-bar-track">
                <div class="stats-bar-fill" style="${barStyle};width:${pct}%"></div>
              </div>
              <span class="stats-bar-value ${valCls}">剩 ${rem}/${max}</span>
            </div>
          `;
        }).join('');

        return `
          <div class="stats-section">
            <div class="stats-section-header">
              <span class="stats-section-name ${sec.isTotal ? 'total' : ''}">${sec.label}</span>
              <span class="stats-section-total">${sec.data.entryCount} 筆</span>
            </div>
            <div class="stats-counts-row">${catCountsHtml}</div>
            ${barsHtml ? barsHtml : ''}
          </div>
        `;
      }).join('');

      return `
        <div class="stats-card">
          <div class="stats-title">${ICONS.star} 應援物統計</div>
          ${sectionsHtml}
          <div class="add-block compact" data-action="add-category">
            <div class="add-block-icon">${ICONS.star}</div>
            <div class="add-block-title">新增類別</div>
          </div>
        </div>
      `;
    }

    function collectFormData() {
      const items = Array.from(document.querySelectorAll('#items-list .item-input'))
        .map(el => el.value.trim())
        .filter(Boolean);
      return {
        date: state.form.date,
        threadsUrl: (document.getElementById('input-threads-url')?.value || '').trim(),
        exchangeItems: items,
        wanted: state.form.wanted.filter(w => w.quantity > 0),
        notes: (document.getElementById('input-notes')?.value || '').trim()
      };
    }

    function saveForm() {
      const data = collectFormData();
      if (!data.threadsUrl && data.exchangeItems.length === 0 && (!data.wanted || data.wanted.length === 0)) return;
      const parsed = parseThreadsUrl(data.threadsUrl);
      const now = Date.now();
      const existing = state.editingId ? state.entries.find(e => e.id === state.editingId) : null;

      const newEntry = {
        id: state.editingId || now.toString(),
        date: data.date,
        threadsUrl: data.threadsUrl,
        threadsUsername: parsed ? parsed.username : '',
        profileUrl: parsed ? parsed.profileUrl : '',
        exchangeItems: data.exchangeItems,
        wanted: data.wanted,
        notes: data.notes,
        createdAt: existing ? existing.createdAt : now,
        updatedAt: now
      };

      if (state.editingId) {
        state.entries = state.entries.map(e => e.id === state.editingId ? newEntry : e);
      } else {
        state.entries = [newEntry, ...state.entries];
      }
      persistEntries();
      closeForm();
      render();
    }

    // ============== Custom confirm dialog ==============
    function customConfirm(message, onConfirm) {
      const overlay = document.getElementById('confirm-overlay');
      const msgEl = document.getElementById('confirm-message');
      const okBtn = document.getElementById('confirm-ok');
      const cancelBtn = document.getElementById('confirm-cancel');

      msgEl.textContent = message;
      overlay.classList.remove('hidden');

      const close = () => {
        overlay.classList.add('hidden');
        okBtn.onclick = null;
        cancelBtn.onclick = null;
        overlay.onclick = null;
      };
      okBtn.onclick = () => { close(); onConfirm && onConfirm(); };
      cancelBtn.onclick = close;
      overlay.onclick = (e) => { if (e.target === overlay) close(); };
    }

                  <label class="date-checkbox ${checked ? 'checked' : ''}">
                    <input type="checkbox" data-action="toggle-date" data-date="${escapeHtml(d)}" ${checked ? 'checked' : ''}>
                    <span>${escapeHtml(dateLabel(d))}</span>
                  </label>
                `;
              }).join('')}
            </div>
          </div>

          <div class="category-list-section">
            <div class="section-title">應援物列表 <span class="section-title-count">${state.categories.length}</span></div>
            <div class="category-list">${catListHtml}</div>
          </div>

          <div class="section-divider">
            <span>${isEditing ? '編輯類別' : '新增類別'}</span>
          </div>

          <div class="field">
            <label>名稱</label>
            <input type="text" class="text-input" id="cat-name-input" value="${escapeHtml(f.name)}" placeholder="例：碩" maxlength="10">
          </div>

          <div class="field">
            <label>圖示</label>
            <div class="icon-picker">${iconsHtml}</div>
          </div>

          <div class="field">
            <label>數量</label>
            <div class="inventory-grid" style="grid-template-columns: repeat(${invDates.length}, 1fr)">${invInputsHtml}</div>
          </div>

          <div class="form-buttons">
            <button class="btn-primary form-submit" data-action="save-category">${isEditing ? '更新' : '＋ 新增'}</button>
            ${isEditing ? '<button class="btn-cancel-edit" data-action="cancel-edit">取消編輯</button>' : ''}
          </div>

        </div>
      `;
    }

    function openCategoryForm(catId) {
      if (catId) {
        const cat = getCategoryById(catId);
        if (!cat) return;
        state.editingCategoryId = catId;
        const inv = cat.inventory || { '7/24': 20, '7/25': 20 };
        state.categoryForm = {
          name: cat.name,
          icon: cat.icon,
          color: cat.color,
          inventory: { '7/24': inv['7/24'], '7/25': inv['7/25'] }
        };
      } else {
        state.editingCategoryId = null;
        const usedColors = new Set(state.categories.map(c => c.color));
        let color = 0;
        for (let i = 0; i < CATEGORY_COLOR_PALETTE.length; i++) {
          if (!usedColors.has(i)) { color = i; break; }
        }
        state.categoryForm = {
          name: '',
          icon: 'emoji:🌸',
          color,
          inventory: { '7/24': 0, '7/25': 0, '7/26': 0 }
        };
      }
      renderSettings();
    }


    function saveCategoryForm() {
      const nameEl = document.getElementById('cat-name-input');
      const name = nameEl ? nameEl.value.trim() : '';
      if (!name) {
        alert('請輸入名稱');
        return;
      }

      // Collect inventory only for enabled dates; disabled dates keep existing values
      const inventory = {};
      const existing = state.editingCategoryId ? getCategoryById(state.editingCategoryId) : null;
      DATE_OPTIONS.forEach(d => {
        if (state.enabledDates.includes(d)) {
          const el = document.getElementById('cat-inv-' + d.replace('/', ''));
          inventory[d] = el ? Math.max(0, parseInt(el.value, 10) || 0) : 0;
        } else if (existing && existing.inventory && existing.inventory[d] !== undefined) {
          // Preserve inventory for disabled dates
          inventory[d] = existing.inventory[d];
        } else {
          inventory[d] = 0;
        }
      });

      const catData = {
        id: state.editingCategoryId || newCategoryId(),
        name,
        icon: state.categoryForm.icon,
        color: state.categoryForm.color,
        inventory
      };

      if (state.editingCategoryId) {
        state.categories = state.categories.map(c => c.id === state.editingCategoryId ? catData : c);
      } else {
        state.categories.push(catData);
      }
      persistCategories();

      // Reset form to add-new mode, stay on settings page
      state.editingCategoryId = null;
      const usedColors = new Set(state.categories.map(c => c.color));
      let nextColor = 0;
      for (let i = 0; i < CATEGORY_COLOR_PALETTE.length; i++) {
        if (!usedColors.has(i)) { nextColor = i; break; }
      }
      const defaultInv = {};
      DATE_OPTIONS.forEach(d => { defaultInv[d] = 0; });
      state.categoryForm = {
        name: '',
        icon: 'emoji:🌸',
        color: nextColor,
        inventory: defaultInv
      };
      renderSettings();
      render();
    }

    function deleteCategory(catId) {
      const cat = getCategoryById(catId);
      if (!cat) return;
      customConfirm('確定要刪除嗎?', () => {
        state.categories = state.categories.filter(c => c.id !== catId);
        persistCategories();
        if (state.editingCategoryId === catId) {
          state.editingCategoryId = null;
          const defaultInv = {};
          DATE_OPTIONS.forEach(d => { defaultInv[d] = 0; });
          state.categoryForm = { name: '', icon: 'emoji:🌸', color: 0, inventory: defaultInv };
        }
        renderSettings();
        render();
      });
    }

    // ============== Event Delegation ==============
    document.addEventListener('click', (e) => {
      const t = e.target.closest('[data-action], [data-filter], [data-main-tab], #btn-export, #btn-save-form, #btn-close-form, #btn-close-settings, #modal, #settings-modal');

      if (!t) return;

      // Main tab switching
      if (t.dataset.mainTab) {
        state.activeTab = t.dataset.mainTab;
        render();
        return;
      }
      // Filter tabs
      if (t.dataset.filter) {
        state.filter = t.dataset.filter;
        render();
        return;
      }
      // FAB

      // Export
      if (t.id === 'btn-export') { exportCsv(getSortedEntries()); return; }
      // Modal buttons
      if (t.id === 'btn-close-form') { closeForm(); return; }
      if (t.id === 'btn-save-form') { saveForm(); return; }
      if (t.id === 'btn-close-settings') {
        closeSettings();
        return;
      }
      // Backdrop click closes modal
      if (t.id === 'modal' && e.target === t) { closeForm(); return; }
      if (t.id === 'settings-modal' && e.target === t) {
        closeSettings();
        return;
      }

      // Data-action buttons
      const action = t.dataset.action;
      if (!action) return;

      if (action === 'edit') {
        const id = t.closest('tr').dataset.id;
        const entry = state.entries.find(x => x.id === id);
        if (entry) openForm(entry);
      } else if (action === 'delete') {
        const id = t.closest('tr').dataset.id;
        customConfirm('確定要刪除嗎?', () => {
          state.entries = state.entries.filter(x => x.id !== id);
          persistEntries();
          render();
        });
      } else if (action === 'set-date') {
        // Only allow selecting enabled dates
        if (!state.enabledDates.includes(t.dataset.date)) return;
        state.form.date = t.dataset.date;
        // sync current input values into state.form so re-render preserves them
        syncFormStateFromDOM();
        renderForm();
      } else if (action === 'save-settings') {
        // If the form has a name filled, save that category first
        const nameEl = document.getElementById('cat-name-input');
        if (nameEl && nameEl.value.trim()) {
          saveCategoryForm();
        }
        closeSettings();
        return;
      } else if (action === 'add-record') {
        openForm();
        return;
      } else if (action === 'add-category') {
        state.editingCategoryId = null;
        const usedColors = new Set(state.categories.map(c => c.color));
        let nextColor = 0;
        for (let i = 0; i < CATEGORY_COLOR_PALETTE.length; i++) {
          if (!usedColors.has(i)) { nextColor = i; break; }
        }
        const defaultInv = {};
        DATE_OPTIONS.forEach(d => { defaultInv[d] = 0; });
        state.categoryForm = { name: '', icon: 'emoji:🌸', color: nextColor, inventory: defaultInv };
        openSettings();
        return;
      } else if (action === 'qty-incr' || action === 'qty-decr') {
        syncFormStateFromDOM();
        const catId = t.dataset.catId;
        let w = state.form.wanted.find(x => x.categoryId === catId);
        if (!w) {
          w = { categoryId: catId, quantity: 0 };
          state.form.wanted.push(w);
        }
        if (action === 'qty-incr') w.quantity++;
        else w.quantity = Math.max(0, w.quantity - 1);
        // Remove entries with 0 quantity to keep data clean
        state.form.wanted = state.form.wanted.filter(x => x.quantity > 0);
        renderForm();
      } else if (action === 'add-item') {
        syncFormStateFromDOM();
        state.form.exchangeItems.push('');
        renderForm();
        // focus the new input
        const inputs = document.querySelectorAll('#items-list .item-input');
        if (inputs.length) inputs[inputs.length - 1].focus();
      } else if (action === 'add-category') {
        openCategoryForm(null);
        return;
      } else if (action === 'edit-category') {
        openCategoryForm(t.dataset.catId);
        return;
      } else if (action === 'delete-category') {
        deleteCategory(t.dataset.catId);
        return;
      } else if (action === 'cancel-edit') {
        // Reset form to add-new mode
        state.editingCategoryId = null;
        const usedColors = new Set(state.categories.map(c => c.color));
        let nextColor = 0;
        for (let i = 0; i < CATEGORY_COLOR_PALETTE.length; i++) {
          if (!usedColors.has(i)) { nextColor = i; break; }
        }
        const defaultInv = {};
        DATE_OPTIONS.forEach(d => { defaultInv[d] = 0; });
        state.categoryForm = { name: '', icon: 'emoji:🌸', color: nextColor, inventory: defaultInv };
        renderSettings();
        return;
      } else if (action === 'save-category') {
        saveCategoryForm();
        return;
      } else if (action === 'set-cat-icon') {
        // Sync current form field values first
        const nameEl = document.getElementById('cat-name-input');
        if (nameEl) state.categoryForm.name = nameEl.value;
        activeDates().forEach(d => {
          const el = document.getElementById('cat-inv-' + d.replace('/', ''));
          if (el) state.categoryForm.inventory[d] = parseInt(el.value, 10) || 0;
        });
        state.categoryForm.icon = t.dataset.icon;
        renderSettings();
        return;
      } else if (action === 'remove-item') {
        syncFormStateFromDOM();
        const idx = parseInt(t.closest('.item-row').dataset.index, 10);
        if (state.form.exchangeItems.length <= 1) {
          state.form.exchangeItems = [''];
        } else {
          state.form.exchangeItems.splice(idx, 1);
        }
        renderForm();
      }
    });

    function syncFormStateFromDOM() {
      const urlEl = document.getElementById('input-threads-url');
      const notesEl = document.getElementById('input-notes');
      if (urlEl) state.form.threadsUrl = urlEl.value;
      if (notesEl) state.form.notes = notesEl.value;
      const items = Array.from(document.querySelectorAll('#items-list .item-input'))
        .map(el => el.value);
      if (items.length > 0) state.form.exchangeItems = items;
    }

    // Handle checkbox changes for date toggles
    document.addEventListener('change', (e) => {
      const t = e.target;
      if (t.dataset && t.dataset.action === 'toggle-date') {
        // Sync current form values before re-render to preserve them
        const nameEl = document.getElementById('cat-name-input');
        if (nameEl) state.categoryForm.name = nameEl.value;
        DATE_OPTIONS.forEach(d => {
          const el = document.getElementById('cat-inv-' + d.replace('/', ''));
          if (el && !el.disabled) state.categoryForm.inventory[d] = parseInt(el.value, 10) || 0;
        });

        const d = t.dataset.date;
        if (t.checked && !state.enabledDates.includes(d)) {
          state.enabledDates.push(d);
        } else if (!t.checked && state.enabledDates.includes(d)) {
          state.enabledDates = state.enabledDates.filter(x => x !== d);
        }
        persistEnabledDates();
        if (state.filter !== 'all' && !state.enabledDates.includes(state.filter)) {
          state.filter = 'all';
        }
        render();
        // Re-render settings modal in-place (does NOT close/reopen modal)
        if (!document.getElementById('settings-modal').classList.contains('hidden')) {
          renderSettings();
        }
      }
    });

    // Live update Threads preview as user types
    document.addEventListener('input', (e) => {
      if (e.target.id === 'input-threads-url') {
        const url = e.target.value;
        state.form.threadsUrl = url;
        const previewParsed = parseThreadsUrl(url);
        const previewEl = document.getElementById('threads-preview');
        if (previewEl) {
          previewEl.innerHTML = previewParsed
            ? `<div class="preview-card">
                 <div class="preview-label">${ICONS.star}<span>預覽</span></div>
                 <a href="${escapeHtml(previewParsed.profileUrl)}" target="_blank" rel="noopener noreferrer" class="preview-username">
                   @${escapeHtml(previewParsed.username)}${ICONS.ext}
                 </a>
                 <div class="preview-hint">點擊即可前往 Threads 主頁</div>
               </div>`
            : (url.trim() ? `<p class="warn">⚠ 無法辨識為 Threads 網址，仍可儲存</p>` : '');
        }
      }
    });

    // ============== Service Worker (offline) ==============
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
      });
    }

    // ============== Init ==============
    loadEnabledDates();
    loadCategories();
    loadEntries();
    migrateCategoriesAndEntries();
    render();
  </script>
</body>
</html>
